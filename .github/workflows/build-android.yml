name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Use the committed debug keystore
        # Must run AFTER prebuild and target android/app, not ~/.android: Expo's
        # template ships its own android/app/debug.keystore and build.gradle points
        # at that, so anything left in the home directory is ignored. Pinning it
        # keeps the signing SHA-1 — which Google matches for the Android OAuth
        # client — under our control and stable across Expo upgrades.
        run: cp ci-debug.keystore android/app/debug.keystore

      - name: Embed the JS bundle in the debug variant
        # Expo's default Gradle config skips bundling JS/assets for debuggableVariants
        # (just "debug" by default), since it assumes a debug build always has a live
        # Metro server to load from. A sideloaded standalone APK never does, so without
        # this it installs and opens to a permanently blank screen — there's no JS in it.
        run: sed -i '/^react {/a\    debuggableVariants = []' android/app/build.gradle

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify the APK's signing fingerprint
        # Fails the build on a signing-cert mismatch rather than letting it surface
        # as a Google DEVELOPER_ERROR on a device. apksigner (not keytool -printcert)
        # because these APKs carry only a v2/v3 signature, which keytool cannot read.
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n1)
          echo "using $APKSIGNER"
          ACTUAL=$("$APKSIGNER" verify --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -i "SHA-1 digest" | head -n1 | awk '{print $NF}' | tr 'a-f' 'A-F')
          EXPECTED="2E5DDC9C57E290C9962A6A240F8179F8BB719430"
          echo "APK SHA-1:      $ACTUAL"
          echo "Expected SHA-1: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate does not match the fingerprint registered with Google."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: introvirght-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
