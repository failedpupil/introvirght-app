name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use the committed debug keystore
        # Without this Gradle generates a random one per run, so the signing
        # certificate — which Google checks for Android OAuth clients — would
        # change every build and break sign-in each time.
        run: |
          mkdir -p ~/.android
          cp ci-debug.keystore ~/.android/debug.keystore

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Embed the JS bundle in the debug variant
        # Expo's default Gradle config skips bundling JS/assets for debuggableVariants
        # (just "debug" by default), since it assumes a debug build always has a live
        # Metro server to load from. A sideloaded standalone APK never does, so without
        # this it installs and opens to a permanently blank screen — there's no JS in it.
        run: sed -i '/^react {/a\    debuggableVariants = []' android/app/build.gradle

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: introvirght-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
